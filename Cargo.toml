[package]
name = "harness-launcher"
version = "0.1.0"
edition = "2024"
license = "MIT"
# The oldest rustc this builds under, which cargo checks before it compiles
# anything. Without it an old toolchain fails part-way through, naming a
# dependency rather than this project.
rust-version = "1.88"

# Clippy's warn-by-default groups are not the whole of it. `pedantic` is the one
# worth adding here: it is opinionated rather than unstable, and most of what it
# catches is a place where an intent was left unstated. The negative priority is
# what lets a single lint be allowed back afterwards — group and lint would
# otherwise be applied in an unspecified order.
#
# `nursery` (unstable, false-positive-prone) and `restriction` (a menu of
# mutually contradictory lints, not a group to enable wholesale) stay off.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dependencies]
portable-pty = "0.9"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde"] }
vt100 = "0.16"

[dev-dependencies]
tempfile = "3.27.0"
