name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `rustup component add`. `rust-toolchain.toml` pins the version and
      # names the components, and rustup installs both on the first cargo call —
      # so the pin is the only place "our toolchain" is written down, and this
      # step exists to say out loud which one that turned out to be.
      - name: Say which toolchain this is
        run: rustup show active-toolchain && cargo clippy --version

      # The tmux tests drive a real tmux on a socket of their own. There is no
      # fake and no abstraction over it: a second implementation existing only
      # for tests would make the harness seam "real" on false pretences.
      - name: Make sure there is a tmux to drive
        run: command -v tmux || (sudo apt-get update && sudo apt-get install -y tmux)

      - run: cargo fmt --check

      # `cargo lint` is the alias in `.cargo/config.toml`, so this is the same
      # command a developer runs. The flags used to live here, which is how the
      # local check and the deciding check came apart.
      - run: cargo lint

      - run: cargo test

      # The harness seam is a place, not an abstraction, so it is held in place
      # mechanically rather than by good intentions. Text matching is fooled by
      # aliasing — recorded rather than hidden. Reach for a stronger mechanism (a
      # workspace split, a lint with per-directory scope) when there is a second
      # author, a second harness, or a reason to bar the pure side from an
      # external dependency.
      # tmux is reached through a process, so barring processes bars it too —
      # which is why the pattern names no multiplexer.
      - name: The harness module performs no I/O
        run: |
          if grep -rEn 'std::process|std::fs|Command::' src/harness/; then
            echo "::error::The harness module translates; the app acts. It must not touch a process or the filesystem."
            exit 1
          fi

      - name: Nothing outside the harness module names the harness
        run: |
          if grep -rEin 'claude|--effort|CLAUDE_CODE' src/ --exclude-dir=harness; then
            echo "::error::A harness-specific fact — a binary name, a flag, an environment variable, a status vocabulary, a screen shape — escaped src/harness/."
            exit 1
          fi
